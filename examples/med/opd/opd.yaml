# trinity run --config examples/med/opd/opd.yaml --plugin-dir examples/med/opd/workflow
project: "Med-opd"
name: "qwen3.5-122B-distill-from-qwen3.5-397B-lr1e-5"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}
algorithm:
  algorithm_type: on_policy_distill
  repeat_times: 8
  optimizer:
    lr: 1e-5
  advantage_fn_args:
    kl_coef: 1.0
model:
  # Student model
  model_path: /mnt/cpfs/shared/qwen/Qwen3.5-122B-A10B
  max_response_tokens: 4096
  max_model_len: 12288
cluster:
  node_num: 12
  gpu_per_node: 8
buffer:
  total_epochs: 1
  batch_size: 96
  explorer_input:
    taskset:
      name: gsm8k
      storage_type: file
      path: /mnt/data/chenyushuo.cys/Trinity/examples/med/debug/opd_example
      split: train
      format:
        messages_key: 'messages'
      rollout_args:
        temperature: 1.0
    default_workflow_type: 'on_policy_distill_message_input_workflow'
  trainer_input:
    experience_buffer:
      name: opd_buffer
      storage_type: queue
explorer:
  eval_interval: 50
  runner_per_model: 8
  rollout_model:
    # Student model for rollout
    engine_num: 2    # 2 node for rollout model, 1 engine per node
    tensor_parallel_size: 1
    data_parallel_size: 8
    enable_expert_parallel: true
    seed: 42
    weight_sync_buffer_size: 3072
    extra_engine_args:
      # vllm-specific engine args can be added here
      max_num_batched_tokens: 8192  # 4096
  auxiliary_models:
    # Teacher model for distillation
    - model_path: /mnt/cpfs/shared/qwen/Qwen3.5-397B-A17B
      engine_num: 1    # 2 node for distill model, 2 node per engine
      nnodes: 2
      tensor_parallel_size: 16
      enable_expert_parallel: true
      gpu_memory_utilization: 0.7
      seed: 42
      weight_sync_buffer_size: 3072
      max_model_len: 16384
      max_prompt_tokens: 4096
      max_response_tokens: 12288
      extra_engine_args:
        # vllm-specific engine args can be added here
        max_num_batched_tokens: 8192  # 4096
synchronizer:
  sync_method: 'nccl'
  sync_interval: 1
  sync_timeout: 1200
trainer:
  save_interval: 100
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 1
  trainer_config:
    actor_rollout_ref:
      model:
        use_remove_padding: ${oc.decode:${oc.env:REMOVE_PADDING,true}}
        use_fused_kernels: ${oc.decode:${oc.env:FUSED_KERNELS,true}}
        fused_kernel_options:
          impl_backend: torch
monitor:
  monitor_type: wandb
