mode: train
continue_from_checkpoint: ${oc.env:CONTINUE_FROM_CHECKPOINT,true}
project: "SFT"
group: ${oc.env:EXP_DATE}-${oc.env:EXP_SOURCE}
name: ${oc.env:EXP_NAME}
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}
algorithm:
  algorithm_type: sft
  optimizer:
    lr: ${oc.env:LR,1e-5}
    lr_scheduler_type: ${oc.env:LR_SCHEDULER_TYPE,cosine}
    lr_warmup_steps_ratio: 0.05
    min_lr_ratio: 0.1
model:
  model_path: ${oc.env:MODEL_DIR}/${oc.env:EXP_MODEL_NAME}
  max_model_len: ${oc.env:MAX_MODEL_LEN,262144}
  enable_thinking: true
cluster:
  node_num: ${oc.env:WORLD_SIZE,1}
  gpu_per_node: ${oc.env:NPROC_PER_NODE,8}
buffer:
  total_epochs: ${oc.env:TOTAL_EPOCHS,1}
  train_batch_size: ${oc.env:BATCH_SIZE,32}
  trainer_input:
    experience_buffer:
      name: ${oc.env:EXP_SOURCE}
      storage_type: file
      path: ${oc.env:DATA_BASE_PATH}/${oc.env:EXP_SOURCE}
      data_selector:
        selector_type: shuffle
      format:
        prompt_type: messages
        messages_key: messages
        enable_concatenated_multi_turn: true
synchronizer:
  sync_method: 'checkpoint'
  sync_interval: 10000
trainer:
  trainer_strategy: ${oc.env:TRAINER_STRATEGY,fsdp2}
  total_steps: ${oc.env:TOTAL_STEPS,1000}
  save_interval: ${oc.env:SAVE_INTERVAL,100}
  enable_prefetch: true
  grad_clip: 1.0
  use_dynamic_bsz: ${oc.env:USE_DYNAMIC_BSZ,true}
  ulysses_sequence_parallel_size: ${oc.env:SP_SIZE,1}
  fix_actor_microbatch_loss_scale: ${oc.env:FIX_LOSS_SCALE,true}
  trainer_config:
    actor_rollout_ref:
      model:
        use_remove_padding: ${oc.decode:${oc.env:REMOVE_PADDING,true}}
        use_fused_kernels: ${oc.decode:${oc.env:FUSED_KERNELS,true}}
        fused_kernel_options:
          impl_backend: torch
        enable_activation_offload: ${oc.decode:${oc.env:ACTIVATION_OFFLOAD,false}}
        tiled_mlp:
          enable: ${oc.decode:${oc.env:TILED_MLP_ENABLE,false}}
          num_shards: ${oc.decode:${oc.env:TILED_MLP_NUM_SHARDS,4}}
      actor:
        freeze_vision_tower: ${oc.decode:${oc.env:FREEZE_VISION_TOWER,false}}
        checkpoint:
          load_contents: ['hf_model']
          save_contents: ['hf_model']
        fsdp_config:
          wrap_policy:
            transformer_layer_cls_to_wrap:
              - "Qwen3_5MoeGatedDeltaNet"
              - "Qwen3_5MoeAttention"
              - "Qwen3_5MoeSparseMoeBlock"
              - "Qwen3_5MoeVisionBlock"
        megatron:
          tensor_model_parallel_size: ${oc.decode:${oc.env:TP_SIZE,1}}
          expert_model_parallel_size: ${oc.decode:${oc.env:EP_SIZE,1}}
          expert_tensor_parallel_size: ${oc.decode:${oc.env:ETP_SIZE,null}}
          pipeline_model_parallel_size: ${oc.decode:${oc.env:PP_SIZE,1}}
          virtual_pipeline_model_parallel_size: ${oc.decode:${oc.env:VPP_SIZE,null}}
          context_parallel_size: ${oc.decode:${oc.env:CP_SIZE,1}}
          # offload settings
          param_offload: false
          grad_offload: false
          optimizer_offload: false
          # whether to use mbridge to import/export parameters
          use_mbridge: true
          vanilla_mbridge: ${oc.env:VANILLA_MBRIDGE,false}
          # Use Megatron checkpoint
          use_dist_checkpointing: false
          dist_checkpointing_path: null
          # recompute settings
          override_transformer_config:
            recompute_granularity: full
            recompute_method: uniform
            recompute_num_layers: 1
monitor:
  monitor_type: wandb
